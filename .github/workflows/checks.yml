name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: swift test
      - run: xcodebuild -project Examples/CredflareExample.xcodeproj -scheme CredflareExample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
