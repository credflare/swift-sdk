name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: swift-sdk
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: credflare/sdk-spec
          path: sdk-spec
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node ../sdk-spec/scripts/generate.mjs --target swift --out Sources/CredflareSDK/Spec.generated.swift --check
        working-directory: swift-sdk
      - run: ./scripts/check-spec.sh
        working-directory: swift-sdk
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: swift test
      - run: xcodebuild -project Examples/CredflareExample.xcodeproj -scheme CredflareExample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
